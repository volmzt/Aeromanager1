name: Android Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compute version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="1.0.0-build.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Android Lint
        run: gradle --no-daemon lintDebug

      - name: Build debug APK (no secrets needed)
        run: gradle --no-daemon assembleDebug

      - name: Prepare keystore
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing skipped: KEYSTORE_BASE64 secret is not set. Only the debug APK is built."
          fi

      - name: Build signed release APK
        if: steps.ks.outputs.signed == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/AeroManager-${{ steps.ver.outputs.version }}-debug.apk"
          if [ "${{ steps.ks.outputs.signed }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/AeroManager-${{ steps.ver.outputs.version }}-release.apk"
          fi
          ls -l dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AeroManager-${{ steps.ver.outputs.version }}
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.ks.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-release.apk
          generate_release_notes: true

      - name: Release skipped notice
        if: startsWith(github.ref, 'refs/tags/v') && steps.ks.outputs.signed != 'true'
        run: echo "::warning::Tag build finished, but no GitHub Release was created because signing secrets are missing."
